[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # אורך שורה נאכף על ידי line-length, לא על ידי הכלל
    "B008",   # Depends() בחתימה הוא הדפוס של FastAPI
    "SIM108", # ternary אינו תמיד קריא יותר
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"scripts/*" = ["E402"]      # sys.path מותאם לפני הייבוא, במכוון
"mcp_server/*" = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
